<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Events — Evently</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#111827;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #E5E7EB;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.header a{color:#7C3AED;text-decoration:none;font-size:14px;font-weight:600}
.logo{font-size:20px;font-weight:900;color:#7C3AED;margin-left:auto}
.logo span{color:#A855F7}
.content{max-width:600px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:#6B7280;margin-bottom:20px}
.who{font-size:12px;color:#6B7280;margin-bottom:18px}
.tier-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:20px}
.tier-free{background:#F3F4F6;color:#6B7280}
.tier-boost{background:#FEF3C7;color:#D97706}
.tier-pro{background:#EDE9FE;color:#7C3AED}
.tier-business{background:#FDF2F8;color:#BE185D}
.event-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.event-card.featured{border-color:#FCD34D;box-shadow:0 1px 3px rgba(252,211,77,.35)}
.event-title{font-size:15px;font-weight:700;margin-bottom:4px}
.event-meta{font-size:12px;color:#6B7280;margin-bottom:10px;line-height:1.6}
.event-actions{display:flex;gap:8px}
.btn-delete{padding:7px 14px;border:1.5px solid #FEE2E2;border-radius:8px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#EF4444}
.going-count{font-size:12px;color:#16A34A;font-weight:600;margin-left:auto;align-self:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#FEF3C7;color:#D97706;margin-left:6px;vertical-align:middle}
.empty{text-align:center;padding:60px 20px;color:#9CA3AF}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h2{font-size:17px;font-weight:700;color:#374151;margin-bottom:8px}
.empty p{font-size:13px;line-height:1.7}
.empty a{color:#7C3AED;font-weight:700;text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.upgrade-banner{background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;border-radius:14px;padding:16px;margin-bottom:20px;text-align:center}
.upgrade-banner h3{font-size:15px;font-weight:800;margin-bottom:6px}
.upgrade-banner p{font-size:12px;opacity:.9;margin-bottom:12px;line-height:1.6}
.upgrade-banner a{display:inline-block;padding:9px 20px;background:#fff;color:#7C3AED;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Back to Evently</a>
  <div class="logo">E<span>v</span>ently</div>
</div>

<div class="content">
  <h1>My Events</h1>
  <p class="sub">The events posted from your account.</p>
  <div class="who" id="who"></div>

  <div id="tier-section" style="display:none">
    <div id="tier-badge" class="tier-badge tier-free">Free tier</div>
  </div>

  <div id="upgrade-section" style="display:none">
    <div class="upgrade-banner">
      <h3>⚡ Get More Reach</h3>
      <p>Upgrade to Pro or Business to feature your events at the top of every feed — no ads, no competing listings.</p>
      <a href="https://thothwisdom.gumroad.com/l/fnsee" target="_blank" rel="noopener">Upgrade to Pro — $9.99/mo</a>
    </div>
  </div>

  <div id="events-container">
    <div class="empty">
      <div class="empty-icon">📅</div>
      <h2>Loading your events…</h2>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Rebuilt Oct 24 2026. The old page asked for "your organiser email" and queried
// events.organiser_email — a column that does not exist, so it always failed — and
// its Delete button could never work either, because events had no delete policy.
// It now reads the signed-in session and the events are keyed by events.user_id.
const SUPABASE_URL = 'https://hvyfeebazmiqateniupm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eWZlZWJhem1pcWF0ZW5pdXBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTI2MTcsImV4cCI6MjA5NTY4ODYxN30.89qqEshOwp1bU2AQbzSpZ36_TuqP2jVULo_9Ug-S9_c';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let myEvents = [];

function escHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3000);
}

function showSignedOut(){
  document.getElementById('who').textContent='';
  document.getElementById('tier-section').style.display='none';
  document.getElementById('upgrade-section').style.display='none';
  document.getElementById('events-container').innerHTML =
    '<div class="empty"><div class="empty-icon">🔑</div><h2>Please log in</h2>' +
    '<p>Your events are tied to your Evently account.<br><a href="index.html">Go to Evently and log in</a></p></div>';
}

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showSignedOut(); return; }
  me = session.user;
  document.getElementById('who').textContent = 'Signed in as ' + (me.email || '');
  await loadMyEvents();
}

async function loadMyEvents(){
  try{
    const [{ data: events, error: evErr }, { data: profile }] = await Promise.all([
      sb.from('events').select('*').eq('user_id', me.id).order('created_at',{ascending:false}),
      sb.from('organiser_profiles').select('tier,tier_expires_at').eq('user_id', me.id).maybeSingle(),
    ]);
    if(evErr) throw evErr;
    myEvents = events || [];
    renderTier(profile);
    renderEvents();
  }catch(err){
    console.error(err);
    document.getElementById('events-container').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><h2>Could not load your events</h2><p>Please try again in a moment.</p></div>';
  }
}

function renderTier(profile){
  const section = document.getElementById('tier-section');
  const badge = document.getElementById('tier-badge');
  const upgradeSection = document.getElementById('upgrade-section');
  section.style.display = 'block';
  const expires = profile?.tier_expires_at;
  // An expired tier is a free tier, however the row still reads.
  const active = !expires || new Date(expires) > new Date();
  const tier = active ? (profile?.tier || 'free') : 'free';
  const tierMap = {
    free: ['tier-free','Free tier'],
    boost: ['tier-boost','⚡ Boost'],
    boost_plus: ['tier-boost','⚡ Boost Plus'],
    pro: ['tier-pro','⭐ Pro Organiser'],
    business: ['tier-business','💼 Business']
  };
  const [cls, label] = tierMap[tier] || tierMap.free;
  badge.className = 'tier-badge '+cls;
  badge.textContent = label + (active && expires ? ' · renews '+new Date(expires).toLocaleDateString() : '');
  upgradeSection.style.display = (tier==='free'||tier==='boost'||tier==='boost_plus') ? 'block' : 'none';
}

function renderEvents(){
  const container = document.getElementById('events-container');
  if(!myEvents.length){
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><h2>No events yet</h2>' +
      '<p>Events you post appear here.<br><a href="index.html">Post your first event</a></p></div>';
    return;
  }
  container.innerHTML = myEvents.map(e => {
    const featured = e.is_featured && (!e.featured_until || new Date(e.featured_until) > new Date());
    return `
    <div class="event-card${featured?' featured':''}" id="card-${escHtml(e.id)}">
      <div class="event-title">${escHtml(e.title)}${featured?'<span class="pill">FEATURED</span>':''}</div>
      <div class="event-meta">📅 ${escHtml(e.date)}${e.time?' · '+escHtml(e.time):''}<br>📍 ${escHtml(e.location||'')}<br>🏷️ ${escHtml(e.category||'')}</div>
      <div class="event-actions">
        <button class="btn-delete" onclick="deleteEvent('${escHtml(e.id)}')">Delete</button>
        <span class="going-count">✓ ${Number(e.going_count)||0} going</span>
      </div>
    </div>`;
  }).join('');
}

async function deleteEvent(id){
  if(!confirm('Delete this event? This cannot be undone.')) return;
  // count:'exact' so a delete that RLS quietly refused is not reported as done.
  const { error, count } = await sb.from('events').delete({ count:'exact' }).eq('id', id).eq('user_id', me.id);
  if(error || !count){
    toast(error?.message || 'Could not delete that event — please try again.');
    return;
  }
  myEvents = myEvents.filter(e=>String(e.id)!==String(id));
  document.getElementById('card-'+id)?.remove();
  toast('Event deleted.');
  if(!myEvents.length) renderEvents();
}

sb.auth.onAuthStateChange((_evt, session)=>{ if(!session){ me=null; showSignedOut(); } });
init();
</script>
</body>
</html>
